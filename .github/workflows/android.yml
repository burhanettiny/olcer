name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Testler
        run: npm test

      - name: Web dosyalarını Android projesine aktar
        run: npm run android

      - name: APK derle
        working-directory: android
        env:
          SURUM_KODU: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk olcer.apk

      # Google Play paketi (AAB). Yayın derlemesi her seferinde denenir; yükleme anahtarı gizli
      # değişkenlerde tanımlıysa imzalanıp Sürümler sayfasına eklenir (magaza/README.md).
      - name: Play Store paketi (AAB) derle
        id: aab
        working-directory: android
        env:
          SURUM_KODU: ${{ github.run_number }}
          ANAHTAR_DOSYASI: ${{ secrets.ANAHTAR_DOSYASI }}
          OLCER_ANAHTAR_SIFRE: ${{ secrets.ANAHTAR_SIFRE }}
        run: |
          if [ -n "$ANAHTAR_DOSYASI" ]; then
            echo "$ANAHTAR_DOSYASI" | base64 -d > "$RUNNER_TEMP/olcer-yukleme.p12"
            export OLCER_ANAHTAR="$RUNNER_TEMP/olcer-yukleme.p12"
          fi
          ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/olcer-yukleme.p12"
          if [ -n "$ANAHTAR_DOSYASI" ]; then
            cp app/build/outputs/bundle/release/app-release.aab ../olcer.aab
            echo "var=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Yükleme anahtarı tanımlı değil: AAB imzasız derlendi ve yayınlanmadı. magaza/README.md'ye bakın."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: olcer-apk
          path: olcer.apk

      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.var == '1'
        with:
          name: olcer-aab
          path: olcer.aab

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOSYALAR="olcer.apk"
          [ -f olcer.aab ] && DOSYALAR="$DOSYALAR olcer.aab"
          gh release create "v1.0.${{ github.run_number }}" $DOSYALAR \
            --title "Ölçer 1.0.${{ github.run_number }}" \
            --notes "Android için Ölçer. Telefonunuzda **olcer.apk** dosyasına dokunup indirin ve kurun (bilinmeyen kaynaklardan kuruluma izin vermeniz gerekebilir). **olcer.aab** varsa Google Play Console'a yüklenecek pakettir." \
            --latest
